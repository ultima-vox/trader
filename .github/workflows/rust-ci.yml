name: Rust foundation

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "rustfmt.toml"
      - "crates/**"
      - "docs/**"
      - "architecture/**"
      - "qualification/**"
      - "ARCHITECTURE.md"
      - "RUST_MIGRATION_PLAN.md"
      - ".github/workflows/rust-ci.yml"
  push:
    branches:
      - main
      - codex/issue-12-rust-foundation
  workflow_dispatch:

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: fmt, clippy, test
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, "1"]
    timeout-minutes: 30
    env:
      BASH_ENV: /dev/null
      # This runner reaches static.rust-lang.org and crates.io unreliably: HTTP/2
      # multiplexing stalls and TLS handshakes are cut. Keep the transport simple
      # and patient, and download nothing that is already on the machine.
      CARGO_HTTP_MULTIPLEXING: false
      CARGO_HTTP_LOW_SPEED_LIMIT: 1
      CARGO_HTTP_TIMEOUT: 120
      CARGO_NET_RETRY: 5
      # The build tree is per-run and disposable; the toolchain is not.
      CARGO_TARGET_DIR: /tmp/vox-target-${{ github.run_id }}
    defaults:
      run:
        shell: 'bash --noprofile --norc -e -o pipefail "{0}"'
    steps:
      - name: Remove stale Vox build trees
        run: |
          set -euo pipefail
          shopt -s nullglob
          # /tmp/vox-cargo-* and /tmp/vox-rustup-* are throwaway toolchain homes
          # from the old per-run install; sweep them out too.
          for candidate in /tmp/vox-cargo-* /tmp/vox-rustup-* /tmp/vox-target-*; do
            resolved="$(realpath -e -- "$candidate")"
            if [[ "$resolved" == "$CARGO_TARGET_DIR" ]]; then
              continue
            fi
            case "$resolved" in
              /tmp/vox-cargo-[0-9]*|/tmp/vox-rustup-[0-9]*|/tmp/vox-target-[0-9]*)
                rm -rf -- "$resolved"
                ;;
              *)
                echo "Refusing unexpected cleanup target: $resolved" >&2
                exit 1
                ;;
            esac
          done
      - uses: actions/checkout@v5
      - name: Use the pinned Rust toolchain
        run: |
          set -euo pipefail
          # The toolchain lives in the runner's home and survives the job. A job
          # that re-downloaded it every run failed whenever the network to
          # static.rust-lang.org was cut, which is most of the time here.
          export RUSTUP_HOME="$HOME/.rustup"
          export CARGO_HOME="$HOME/.cargo"
          export PATH="$CARGO_HOME/bin:$PATH"

          # One source of truth for the version: the file cargo itself obeys.
          channel="$(sed -n 's/^channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' rust-toolchain.toml | tr -d '\r' | head -n 1)"
          if [[ -z "$channel" ]]; then
            echo "rust-toolchain.toml declares no channel" >&2
            exit 1
          fi

          if [[ ! -x "$CARGO_HOME/bin/rustup" ]]; then
            rustup_init="$RUNNER_TEMP/rustup-init"
            curl -4 --proto '=https' --tlsv1.2 --retry 5 \
              --retry-all-errors --retry-delay 5 -sSfL \
              https://static.rust-lang.org/rustup/dist/x86_64-unknown-linux-gnu/rustup-init \
              -o "$rustup_init"
            chmod +x "$rustup_init"
            "$rustup_init" -y --no-modify-path --profile minimal --default-toolchain none
          fi

          if rustup toolchain list | grep -q "^${channel}-"; then
            echo "$channel is already installed; not touching the network"
          else
            for attempt in 1 2 3; do
              if rustup toolchain install "$channel" --profile minimal \
                --component clippy,rustfmt; then
                break
              fi
              [[ "$attempt" -lt 3 ]] || exit 1
              sleep "$((attempt * 10))"
            done
          fi

          echo "RUSTUP_HOME=$RUSTUP_HOME" >> "$GITHUB_ENV"
          echo "CARGO_HOME=$CARGO_HOME" >> "$GITHUB_ENV"
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"

          # rust-toolchain.toml selects the toolchain; prove it selected the
          # pinned one rather than whatever happens to be the rustup default.
          active="$(rustup show active-toolchain)"
          echo "$active"
          case "$active" in
            "$channel"-*) ;;
            *)
              echo "the active toolchain is not the pinned $channel" >&2
              exit 1
              ;;
          esac
          rustc --version
      - name: Fetch locked dependencies
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if cargo fetch --locked; then
              break
            fi
            [[ "$attempt" -lt 3 ]] || exit 1
            sleep "$((attempt * 10))"
          done
          # Everything the lockfile names is on disk; the rest of the job is
          # offline, so a network stall cannot turn into a false red build.
          echo "CARGO_NET_OFFLINE=true" >> "$GITHUB_ENV"
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace --all-targets --all-features
      - name: Smoke Vox Core composition
        run: cargo run --locked -p vox-core --bin vox-core
      - name: Remove this run's build tree
        if: always()
        run: |
          set -euo pipefail
          [[ -e "$CARGO_TARGET_DIR" ]] || exit 0
          resolved="$(realpath -e -- "$CARGO_TARGET_DIR")"
          case "$resolved" in
            /tmp/vox-target-[0-9]*)
              rm -rf -- "$resolved"
              ;;
            *)
              echo "Refusing unexpected cleanup target: $resolved" >&2
              exit 1
              ;;
          esac
