name: Rust foundation

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "rustfmt.toml"
      - "crates/**"
      - "docs/rust-foundation.md"
      - "ARCHITECTURE.md"
      - "RUST_MIGRATION_PLAN.md"
      - ".github/workflows/rust-ci.yml"
  push:
    branches:
      - main
      - codex/issue-12-rust-foundation
  workflow_dispatch:

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: fmt, clippy, test
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, "1"]
    timeout-minutes: 30
    env:
      BASH_ENV: /dev/null
      CARGO_HOME: /tmp/vox-cargo-${{ github.run_id }}
      CARGO_TARGET_DIR: /tmp/vox-target-${{ github.run_id }}
      RUSTUP_HOME: /tmp/vox-rustup-${{ github.run_id }}
    defaults:
      run:
        shell: 'bash --noprofile --norc -e -o pipefail "{0}"'
    steps:
      - name: Remove stale Vox CI artifacts
        run: |
          set -euo pipefail
          shopt -s nullglob
          for candidate in /tmp/vox-cargo-* /tmp/vox-rustup-* /tmp/vox-target-*; do
            resolved="$(realpath -e -- "$candidate")"
            case "$resolved" in
              /tmp/vox-cargo-[0-9]*|/tmp/vox-rustup-[0-9]*|/tmp/vox-target-[0-9]*)
                rm -rf -- "$resolved"
                ;;
              *)
                echo "Refusing unexpected cleanup target: $resolved" >&2
                exit 1
                ;;
            esac
          done
      - uses: actions/checkout@v5
      - name: Install pinned Rust toolchain
        run: |
          set -euo pipefail
          if [[ ! -x "$CARGO_HOME/bin/rustup" ]]; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain none
          fi
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
          export PATH="$CARGO_HOME/bin:$PATH"
          rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
          rustup default 1.97.1
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace
      - name: Smoke Vox Core composition
        run: cargo run --locked -p vox-core --bin vox-core
      - name: Remove current Vox CI artifacts
        if: always()
        run: |
          set -euo pipefail
          for candidate in "$CARGO_HOME" "$RUSTUP_HOME" "$CARGO_TARGET_DIR"; do
            [[ -e "$candidate" ]] || continue
            resolved="$(realpath -e -- "$candidate")"
            case "$resolved" in
              /tmp/vox-cargo-[0-9]*|/tmp/vox-rustup-[0-9]*|/tmp/vox-target-[0-9]*)
                rm -rf -- "$resolved"
                ;;
              *)
                echo "Refusing unexpected cleanup target: $resolved" >&2
                exit 1
                ;;
            esac
          done
