# Evidence for the design system on the exact commit under review.
# Runs the strict per-widget matrix, proves the negative controls still fire, re-checks
# governance statically, and uploads the rendered reference so a human review can be
# reproduced against the restored canonical source.
name: Design Verify

on:
  pull_request:
    paths:
      - 'frontend/design-system/**'
      - 'docs/design/**'
      - 'tools/design-verify/**'
      - '.github/workflows/design-verify.yml'
  push:
    branches: ["main"]
    paths:
      - 'frontend/design-system/**'
      - 'docs/design/**'
      - 'tools/design-verify/**'
      - '.github/workflows/design-verify.yml'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to verify (branch, tag, or commit SHA)'
        required: false

permissions:
  contents: read

concurrency:
  group: design-verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the commit under review
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}

      - name: Report the verified commit
        shell: bash
        run: |
          echo "verifying $(git rev-parse HEAD)"
          echo "VERIFIED_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Restore the canonical visual source
        shell: bash
        run: bash docs/design/source/restore-canonical-design.sh

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright and Chromium
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tools/design-verify/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Static governance checks
        shell: bash
        run: python tools/design-verify/static_checks.py

      - name: Strict per-widget matrix and negative controls
        shell: bash
        run: |
          python tools/design-verify/strict_verify.py \
            --report design-verify-report.json \
            --shots design-verify-shots

      - name: Build the rendered reference for review
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site && mkdir -p _site
          cp -a frontend/design-system/. _site/
          touch _site/.nojekyll
          sed -e 's|\.\./tokens/|tokens/|g' \
              -e 's|\.\./primitives/|primitives/|g' \
              -e 's|\.\./components/|components/|g' \
              -e 's|\.\./patterns/|patterns/|g' \
              -e 's|"\./assets/|"reference/assets/|g' \
              frontend/design-system/reference/index.html > _site/index.html
          grep -q 'href="tokens/tokens.css"' _site/index.html
          ! grep -q 'http-equiv="refresh"' _site/index.html
          cp docs/design/source/Vox-Trader-Design-System-canonical.html _site/canonical-source.html

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: design-verify-${{ env.VERIFIED_SHA }}
          path: |
            design-verify-report.json
            design-verify-shots/
          retention-days: 30

      - name: Upload the rendered reference and the canonical source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: design-reference-${{ env.VERIFIED_SHA }}
          path: _site/
          retention-days: 30
