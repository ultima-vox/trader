# Proves the application API contract on the exact commit under review.
#
# The OpenAPI document and the TypeScript client are generated artefacts. This workflow
# regenerates both and fails on any diff, so a hand-edited DTO cannot reach main, and it
# typechecks the client so the frontend cannot be handed something that does not compile.
name: API Contract

on:
  pull_request:
    paths:
      - 'crates/**'
      - 'docs/api/**'
      - 'frontend/api-client/**'
      - 'tools/api-client/**'
      - '.github/workflows/api-contract.yml'
  push:
    branches: ["main"]
    paths:
      - 'crates/**'
      - 'docs/api/**'
      - 'frontend/api-client/**'
      - 'tools/api-client/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  contract:
    runs-on: [self-hosted, Linux, X64, "1"]
    steps:
      - name: Checkout the commit under review
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Report the verified commit
        run: echo "verifying $(git rev-parse HEAD)"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Build the workspace
        run: cargo build --workspace --locked

      - name: Test the API crate
        run: cargo test -p vox-api --locked

      - name: Lint the API crate
        run: cargo clippy -p vox-api --all-targets --locked -- -D warnings

      - name: Regenerate the OpenAPI document
        run: cargo run -p vox-api --bin openapi --locked -- docs/api/openapi.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Regenerate the TypeScript client
        run: python tools/api-client/generate.py

      - name: Fail on generated-artefact drift
        run: |
          if ! git diff --quiet -- docs/api/openapi.json frontend/api-client/src; then
            echo "::error::the committed OpenAPI document or TypeScript client is stale"
            echo "run: cargo run -p vox-api --bin openapi -- docs/api/openapi.json && python tools/api-client/generate.py"
            git --no-pager diff --stat -- docs/api/openapi.json frontend/api-client/src
            git --no-pager diff -- docs/api/openapi.json frontend/api-client/src | head -200
            exit 1
          fi
          echo "generated artefacts are current"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Typecheck the generated client
        working-directory: frontend/api-client
        run: |
          npm install --no-audit --no-fund
          npx tsc --noEmit

      - name: Prove the API answers on a real socket
        run: |
          set -euo pipefail
          export VOX_API_BIND=127.0.0.1:18099
          export VOX_ENV=sandbox
          export VOX_PLATFORM_DB=/tmp/vox-api-contract-platform.sqlite3
          export VOX_SECRET_DB=/tmp/vox-api-contract-secrets.sqlite3
          export VOX_RUNTIME_DB_DIR=/tmp/vox-api-contract-runtime
          export VOX_KEK_ACTIVE_VERSION=1
          export VOX_KEK_HEX_V1=4949494949494949494949494949494949494949494949494949494949494949
          export VOX_BOOTSTRAP_USER_ID=user:00000000-0000-4000-8000-000000000017
          export VOX_BOOTSTRAP_CREDENTIAL=ci-bootstrap-credential-material-00000000000000000000000000001
          export VOX_BOOTSTRAP_EXPIRES_UNIX_MS=4102444800000
          export VOX_SESSION_COOKIE_SECURE=false
          ./target/debug/vox-server &
          server=$!
          trap 'kill $server' EXIT
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:18099/api/v1/system/health >/dev/null; then break; fi
            sleep 1
          done

          echo "health:"
          curl -sf http://127.0.0.1:18099/api/v1/system/health

          VOX_API_BASE_URL=http://127.0.0.1:18099 \
            npm --prefix frontend/api-client run test:session
