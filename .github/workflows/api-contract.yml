# Proves the application API contract on the exact commit under review.
#
# The OpenAPI document and the TypeScript client are generated artefacts. This workflow
# regenerates both and fails on any diff, so a hand-edited DTO cannot reach main, and it
# typechecks the client so the frontend cannot be handed something that does not compile.
name: API Contract

on:
  pull_request:
    paths:
      - 'crates/**'
      - 'docs/api/**'
      - 'frontend/api-client/**'
      - 'tools/api-client/**'
      - '.github/workflows/api-contract.yml'
  push:
    branches: ["main"]
    paths:
      - 'crates/**'
      - 'docs/api/**'
      - 'frontend/api-client/**'
      - 'tools/api-client/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  BASH_ENV: /dev/null
  RUSTUP_HOME: /home/anubis/.rustup
  CARGO_HOME: /home/anubis/.cargo
  PATH: /home/anubis/.cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

defaults:
  run:
    shell: 'bash --noprofile --norc -e -o pipefail "{0}"'

jobs:
  contract:
    runs-on: [self-hosted, Linux, X64, "1"]
    steps:
      - name: Checkout the commit under review
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Report the verified commit
        run: echo "verifying $(git rev-parse HEAD)"

      - name: Use the pinned local Rust toolchain
        run: |
          set -euo pipefail
          channel="$(sed -n 's/^channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' rust-toolchain.toml | tr -d '\r' | head -n 1)"
          test -n "$channel"
          active="$(rustup show active-toolchain)"
          echo "$active"
          case "$active" in
            "$channel"-*) ;;
            *) echo "the active toolchain is not the pinned $channel" >&2; exit 1 ;;
          esac
          rustc --version
          cargo --version
          cargo clippy --version
          cargo fmt --version

      - name: Build the workspace
        run: cargo build --workspace --locked

      - name: Test the API crate
        run: cargo test -p vox-api --locked

      - name: Lint the API crate
        run: cargo clippy -p vox-api --all-targets --locked -- -D warnings

      - name: Regenerate the OpenAPI document
        run: cargo run -p vox-api --bin openapi --locked -- docs/api/openapi.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Regenerate the TypeScript client
        run: python tools/api-client/generate.py

      - name: Fail on generated-artefact drift
        run: |
          if ! git diff --quiet -- docs/api/openapi.json frontend/api-client/src; then
            echo "::error::the committed OpenAPI document or TypeScript client is stale"
            echo "run: cargo run -p vox-api --bin openapi -- docs/api/openapi.json && python tools/api-client/generate.py"
            git --no-pager diff --stat -- docs/api/openapi.json frontend/api-client/src
            git --no-pager diff -- docs/api/openapi.json frontend/api-client/src | head -200
            exit 1
          fi
          echo "generated artefacts are current"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Typecheck the generated client
        working-directory: frontend/api-client
        run: |
          npm install --no-audit --no-fund
          npx tsc --noEmit

      - name: Prove the API answers on a real socket
        run: |
          set -euo pipefail
          export VOX_API_BIND=127.0.0.1:18099
          export VOX_ENV=sandbox
          export VOX_PLATFORM_DB=/tmp/vox-api-contract-platform.sqlite3
          export VOX_SECRET_DB=/tmp/vox-api-contract-secrets.sqlite3
          export VOX_RUNTIME_DB_DIR=/tmp/vox-api-contract-runtime
          export VOX_KEK_ACTIVE_VERSION=1
          export VOX_KEK_HEX_V1=4949494949494949494949494949494949494949494949494949494949494949
          export VOX_BOOTSTRAP_USER_ID=user:00000000-0000-4000-8000-000000000017
          export VOX_BOOTSTRAP_SESSION_TOKEN=ci-session-token-material-00000000000000000000000000000001
          export VOX_BOOTSTRAP_CSRF_TOKEN=ci-csrf-token-material-000000000000000000000000000000001
          export VOX_BOOTSTRAP_SESSION_EXPIRES_UNIX_MS=4102444800000
          auth=(-H "Cookie: vox_session=$VOX_BOOTSTRAP_SESSION_TOKEN")
          ./target/debug/vox-server &
          server=$!
          trap 'kill $server' EXIT
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:18099/api/v1/system/health >/dev/null; then break; fi
            sleep 1
          done

          echo "health:"
          curl -sf http://127.0.0.1:18099/api/v1/system/health

          echo "capabilities name their owners:"
          curl -sf "${auth[@]}" http://127.0.0.1:18099/api/v1/capabilities |
            python -c "import json,sys; d=json.load(sys.stdin); assert d['unavailable'], 'nothing is reported unavailable'; assert all(u['owner'] for u in d['unavailable']), 'an unavailable capability has no owner'; print(' ', len(d['supported']), 'supported,', len(d['unavailable']), 'unavailable')"

          echo "runtime scopes are empty until #17 bindings exist:"
          curl -sf "${auth[@]}" http://127.0.0.1:18099/api/v1/runtime/scopes |
            python -c "import json,sys; d=json.load(sys.stdin); assert d==[], d; print('  []')"

          echo "runtime health is the accepted #11 contract, not CAPABILITY_UNAVAILABLE:"
          code=$(curl -s "${auth[@]}" -o /tmp/runtime.json -w '%{http_code}' http://127.0.0.1:18099/api/v1/runtime)
          test "$code" = "200" || { echo "expected 200, got $code"; cat /tmp/runtime.json; exit 1; }
          python -c "import json; d=json.load(open('/tmp/runtime.json')); assert d['state']=='STARTING', d; assert d['reason_code']=='STARTUP', d; assert d['execution_authorized'] is False, d; assert d['new_exposure_allowed'] is False, d; print(' ', d['state'], d['reason_code'])"

          echo "an unknown stored binding refuses before broker access:"
          code=$(curl -s "${auth[@]}" -o /tmp/accounts.json -w '%{http_code}' 'http://127.0.0.1:18099/api/v1/accounts?provider=T_INVEST&environment=SANDBOX&broker_connection_id=connection:00000000-0000-4000-8000-000000000017&account_id=vox-account:00000000-0000-4000-8000-000000000017')
          test "$code" = "404" || { echo "expected 404, got $code"; cat /tmp/accounts.json; exit 1; }
          python -c "import json; d=json.load(open('/tmp/accounts.json')); assert d['code']=='ACCOUNT_BINDING_NOT_FOUND', d; print(' ', d['code'])"

          echo "market data refuses instead of inventing a price:"
          code=$(curl -s "${auth[@]}" -o /tmp/quote.json -w '%{http_code}' 'http://127.0.0.1:18099/api/v1/market/quote?provider=T_INVEST&instrument_uid=probe')
          test "$code" = "503" || { echo "expected 503, got $code"; cat /tmp/quote.json; exit 1; }
          python -c "import json; d=json.load(open('/tmp/quote.json')); assert d['details']['capability']=='MARKET_DATA', d; assert d['details']['owner'], d; print(' ', d['details']['capability'], d['details']['owner'])"

          echo "the served document matches the committed one:"
          curl -sf "${auth[@]}" http://127.0.0.1:18099/api/v1/openapi.json -o /tmp/served.json
          python -c "import json; a=json.load(open('/tmp/served.json')); b=json.load(open('docs/api/openapi.json')); assert a==b, 'the served OpenAPI differs from the committed artefact'; print('  identical')"

          echo "an unknown route is a typed 404:"
          curl -s "${auth[@]}" -o /tmp/nf.json -w '  %{http_code}\n' http://127.0.0.1:18099/api/v2/whatever
          python -c "import json; d=json.load(open('/tmp/nf.json')); assert d['category']=='NOT_FOUND', d; print('  typed error envelope')"
