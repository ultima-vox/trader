name: Design Preview

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to publish (branch, tag, or commit SHA)'
        required: false
        default: 'claude/design-system-foundation'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: design-preview-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Build static preview
        shell: bash
        run: |
          set -euo pipefail
          test -f frontend/design-system/reference/index.html
          rm -rf _site
          mkdir -p _site
          cp -a frontend/design-system/. _site/
          touch _site/.nojekyll
          cat > _site/index.html <<'EOF'
          <!doctype html>
          <html lang="ru">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <meta http-equiv="refresh" content="0; url=reference/index.html">
            <title>Vox Trader Design Preview</title>
          </head>
          <body>
            <p><a href="reference/index.html">Open Vox Trader Design System</a></p>
          </body>
          </html>
          EOF

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
