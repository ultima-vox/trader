name: Design Preview

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to publish (branch, tag, or commit SHA)'
        required: false
        default: 'claude/design-system-foundation'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: design-preview-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Build static preview
        shell: bash
        run: |
          set -euo pipefail
          test -f frontend/design-system/reference/index.html
          rm -rf _site
          mkdir -p _site
          cp -a frontend/design-system/. _site/
          touch _site/.nojekyll

          # The canonical reference renders at the site root itself — no redirect page.
          # The design file is not edited: only its relative asset paths are rewritten
          # for the shallower location (reference/index.html keeps working as before).
          sed -e 's|\.\./tokens/|tokens/|g'               -e 's|\.\./primitives/|primitives/|g'               -e 's|\.\./components/|components/|g'               -e 's|\.\./patterns/|patterns/|g'               -e 's|"\./assets/|"reference/assets/|g'               frontend/design-system/reference/index.html > _site/index.html

          # Fail the build rather than publish a page whose styles will not resolve.
          grep -q 'href="tokens/tokens.css"' _site/index.html
          grep -q 'href="primitives/primitives.css"' _site/index.html
          grep -q 'href="components/components.css"' _site/index.html
          grep -q 'href="patterns/patterns.css"' _site/index.html
          grep -q 'href="reference/assets/vox-mark.svg"' _site/index.html
          ! grep -q 'http-equiv="refresh"' _site/index.html
          test -s _site/tokens/tokens.css
          test -s _site/reference/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
